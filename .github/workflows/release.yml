name: Release binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: '1'

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Match tag to workspace version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          manifest = Path('Cargo.toml').read_text(encoding='utf-8')
          package = re.search(r'(?ms)^\[workspace\.package\]\s*\n(.*?)(?=^\[|\Z)', manifest)
          if package is None:
              raise SystemExit('Cargo.toml has no [workspace.package]')
          match = re.search(r'(?m)^\s*version\s*=\s*"([^"]+)"\s*$', package.group(1))
          if match is None:
              raise SystemExit('Cargo.toml has no workspace package version')
          version = match.group(1)
          if not re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?', version):
              raise SystemExit('Workspace version must be a SemVer release version')
          if os.environ['EVENT_NAME'] == 'push' and os.environ['REF_NAME'] != 'v' + version:
              raise SystemExit('Tag must equal v + workspace version; update Cargo.toml and Cargo.lock first')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('version=' + version + '\n')
          print('Validated workspace version:', version)
          PY

  quality:
    name: Rust formatting and lint
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --all -- --check
      - name: Test release packaging
        run: python3 -m unittest discover -s tests -p 'test_package_release.py'
      - run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings

  build:
    name: Build ${{ matrix.target }}
    needs: [validate, quality]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            binary: agent-memory
          - runner: macos-14
            target: aarch64-apple-darwin
            binary: agent-memory
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add --toolchain stable "$TARGET"
      - name: Test on the native platform
        run: cargo +stable test --workspace --locked
      - name: Build release binary
        env:
          TARGET: ${{ matrix.target }}
          BINARY: ${{ matrix.binary }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          cargo +stable build -p agent-memory --release --locked --target "$TARGET"
          actual=$("target/$TARGET/release/$BINARY" --version)
          test "$actual" = "agent-memory $VERSION"
      - name: Package binary and checksum
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: python3 scripts/package-release.py --target "$TARGET" --version "$VERSION" --output dist
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [validate, quality, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify and combine checksums
        working-directory: dist
        run: |
          test "$(find . -maxdepth 1 -name '*.sha256' | wc -l)" -eq 2
          sha256sum --check -- *.sha256
          cat -- *.sha256 > SHA256SUMS
      - name: Publish archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "${TAG%%+*}" == *-* ]]; then
            flags+=(--prerelease)
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --verify-tag --title "$TAG" --generate-notes "${flags[@]}"
          fi
